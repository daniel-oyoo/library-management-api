spring.application.name=library_management
server.port=8081

# Google Books
google.books.base-url=https://www.googleapis.com/books/v1
google.books.api-key=${GOOGLE_BOOKS_API_KEY:}
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
resilience4j.circuitbreaker.instances.googleBooks.slidingWindowSize=10
resilience4j.circuitbreaker.instances.googleBooks.failureRateThreshold=50
resilience4j.circuitbreaker.instances.googleBooks.waitDurationInOpenState=10s

# H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates tables
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Shared API tier budgets, replenished once per fixed window.
app.rate-limit.window-ms=60000
app.rate-limit.retry-after-seconds=60
app.rate-limit.tiers.instant-capacity=1000
app.rate-limit.tiers.queue-capacity=5000
app.rate-limit.tiers.manual-capacity=10000

# Logging
logging.level.org.springframework.jdbc=DEBUG